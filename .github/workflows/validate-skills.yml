name: Validate Skills

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/validate-skills.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/validate-skills.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Metadata and positive/negative fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install validation dependency
        run: python -m pip install -r requirements.txt
      - name: Validate production metadata
        run: python scripts/validate_skills.py skills
      - name: Validate fixed positive fixture
        run: python scripts/validate_skills.py tests/fixtures/valid
      - name: Test positive and negative fixtures
        run: python -m unittest discover -s tests -v
