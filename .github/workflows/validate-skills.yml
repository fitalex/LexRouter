name: Validate Skills

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'data/discovery/**'
      - 'data/intake/**'
      - 'docs/SKILL_INTAKE_POLICY.md'
      - 'docs/P1_SELECTION_PLAN.md'
      - 'docs/P1_READINESS.md'
      - 'schemas/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/validate-skills.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'data/discovery/**'
      - 'data/intake/**'
      - 'docs/SKILL_INTAKE_POLICY.md'
      - 'docs/P1_SELECTION_PLAN.md'
      - 'docs/P1_READINESS.md'
      - 'schemas/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/validate-skills.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Metadata, candidates, readiness, intake and positive/negative fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install validation dependency
        run: python -m pip install -r requirements.txt
      - name: Validate production metadata
        run: python scripts/validate_skills.py skills
      - name: Validate fixed positive fixture
        run: python scripts/validate_skills.py tests/fixtures/valid
      - name: Validate discovery candidates (offline structure only)
        run: python scripts/validate_candidates.py data/discovery/candidates.json
      - name: Validate fixed candidate positive fixture
        run: python scripts/validate_candidates.py tests/fixtures/candidates/valid.json
      - name: Validate P1 readiness and complete candidate linkage (offline)
        run: python scripts/validate_p1_readiness.py data/discovery/p1-readiness.json
      - name: Validate synthetic P1 positive fixture (offline)
        run: python scripts/validate_p1_readiness.py tests/fixtures/p1-readiness/valid.json --candidates tests/fixtures/p1-readiness/candidates.json
      - name: Validate P0 intake proposals and audit linkage (offline)
        run: python scripts/validate_intake_plan.py data/intake/p1-proposals.json
      - name: Validate synthetic intake positive fixture (offline)
        run: python scripts/validate_intake_plan.py tests/fixtures/intake/valid.json --candidates tests/fixtures/p1-readiness/candidates.json --readiness tests/fixtures/p1-readiness/valid.json
      - name: Test positive and negative fixtures
        run: python -m unittest discover -s tests -v
