name: Validate Skills

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'data/discovery/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/validate-skills.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'data/discovery/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/validate-skills.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Metadata, discovery candidates and positive/negative fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install validation dependency
        run: python -m pip install -r requirements.txt
      - name: Validate production metadata
        run: python scripts/validate_skills.py skills
      - name: Validate fixed positive fixture
        run: python scripts/validate_skills.py tests/fixtures/valid
      - name: Validate discovery candidates (offline structure only)
        run: python scripts/validate_candidates.py data/discovery/candidates.json
      - name: Validate fixed candidate positive fixture
        run: python scripts/validate_candidates.py tests/fixtures/candidates/valid.json
      - name: Test positive and negative fixtures
        run: python -m unittest discover -s tests -v
